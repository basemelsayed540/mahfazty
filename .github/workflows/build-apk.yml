name: Build APK (مرة واحدة)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Point the app at the live web page
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          export APP_URL="https://$OWNER.github.io/$REPO_NAME/"
          echo "App URL: $APP_URL"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.server={url:process.env.APP_URL,cleartext:false};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
      - run: npx cap sync android
      - name: Decode signing key
        env:
          BUNDLE: ${{ secrets.KEYSTORE_BUNDLE }}
        run: |
          test -n "$BUNDLE" || { echo "Missing secret KEYSTORE_BUNDLE"; exit 1; }
          echo "$BUNDLE" | head -n1 | tr -d '\r\n' > "$RUNNER_TEMP/ks.pass"
          echo "$BUNDLE" | tail -n +2 | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/mahfazty.keystore"
      - run: chmod +x android/gradlew
      - name: Build signed release APK
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/mahfazty.keystore
        run: |
          export KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/ks.pass")"
          ./gradlew assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk mahfazty.apk
      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk mahfazty.apk --title "محفظتي - APK" --notes "نزّل mahfazty.apk وثبّته. نسخة رقم ${{ github.run_number }}" --latest
